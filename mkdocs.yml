site_name: EU AI Act FAQ & Navigator | 歐盟 AI 法案雙語指南
site_url: https://jackylawck.github.io/euaiact-faq/
site_author: EU AI Governance Working Group
site_description: bilingual (ZH/EN) FAQ for Regulation (EU) 2024/1689. 歐盟人工智能法案企業合規雙語問答。
repo_url: https://github.com/jackylawck/euaiact-faq
repo_name: jackylawck/euaiact-faq
copyright: 'Copyright &copy; 2026 EU AI Governance Working Group. Licensed under CC BY-NC 4.0'

theme:
  name: material
  custom_dir: overrides
  favicon: assets/euaiactfaq192icon.png
  logo: assets/euaiactfaq192icon.png
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換至暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換至亮色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

plugins:
  - search

extra:
  manifest: manifest.webmanifest
  meta:
    - name: mobile-web-app-capable
      content: "yes"
    - name: apple-mobile-web-app-capable
      content: "yes"
    - name: apple-mobile-web-app-status-bar-style
      content: "black-translucent"
    - name: apple-mobile-web-app-title
      content: "EU AI Act"
    - name: theme-color
      content: "#3f51b5"

nav:
  - 首頁導覽 (Overview): index.md
  - 01 適用邊界 (Scope): 01-scope.md
  - 02 角色界定 (Roles): 02-roles.md
  - 03 風險分級 (Risk Tiers): 03-risk-tier.md
  - 04 部署者義務 (Deployer Obligations): 04-obligations.md
  - 05 處罰與時間表 (Penalties & Timeline): 05-penalties.md
