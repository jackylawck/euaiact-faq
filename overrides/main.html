{% extends "base.html" %}

{% block extrahead %}
  <!-- Enterprise Security Headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Apple Touch & PWA Manifest -->
  <link rel="apple-touch-icon" sizes="192x192" href="{{ base_url }}/assets/euaiactfaq192icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="{{ base_url }}/assets/euaiactfaq512icon.png">
  <link rel="manifest" href="{{ base_url }}/manifest.webmanifest">
{% endblock %}
